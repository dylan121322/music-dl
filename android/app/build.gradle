plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.musicdl'
    compileSdk 34

    defaultConfig {
        applicationId "com.musicdl"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.4.1"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }

        python {
            // Set CHAQUOPY_PYTHON env var to your Python path on Windows:
            //   set CHAQUOPY_PYTHON=C:\Python312\python.exe
            buildPython System.getenv("CHAQUOPY_PYTHON") ?: "/usr/bin/python3"
            pip {
                install "fastapi==0.95.2"
                install "uvicorn==0.23.2"
                install "requests"
                install "rich"
                install "websocket-client"
                install "pydantic==1.10.15"
            }
        }
    }

    signingConfigs {
        release {
            // Create a keystore: keytool -genkey -v -keystore musicdl.jks -alias musicdl -keyalg RSA -keysize 2048 -validity 10000
            // Then set env vars: MUSICDL_KEYSTORE, MUSICDL_KEY_ALIAS, MUSICDL_KEY_PASS, MUSICDL_STORE_PASS
            def ksFile = System.getenv("MUSICDL_KEYSTORE")
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword System.getenv("MUSICDL_STORE_PASS")
                keyAlias System.getenv("MUSICDL_KEY_ALIAS")
                keyPassword System.getenv("MUSICDL_KEY_PASS")
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
}
