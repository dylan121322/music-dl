name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn requests rich websocket-client pyinstaller pywebview

      - name: Build with PyInstaller
        run: |
          pyinstaller --onedir --name "MusicDL" \
            --add-data "static:static" \
            --add-data "sources:sources" \
            --add-data "server.py:." \
            --add-data "server_models.py:." \
            --add-data "server_state.py:." \
            --add-data "server_routes_config.py:." \
            --add-data "server_routes_search.py:." \
            --add-data "server_routes_download.py:." \
            --add-data "server_routes_auth.py:." \
            --add-data "api.py:." \
            --add-data "downloader.py:." \
            --add-data "utils.py:." \
            --add-data "models.py:." \
            --add-data "cdp_cookies.py:." \
            --add-data "logger.py:." \
            --add-data "exporter.py:." \
            --add-data "link_extractor.py:." \
            --hidden-import "websocket" \
            --hidden-import "uvicorn.logging" \
            --hidden-import "uvicorn.loops" \
            --hidden-import "uvicorn.loops.auto" \
            --hidden-import "uvicorn.protocols" \
            --hidden-import "uvicorn.protocols.http" \
            --hidden-import "uvicorn.protocols.http.auto" \
            --hidden-import "uvicorn.protocols.websockets" \
            --hidden-import "uvicorn.protocols.websockets.auto" \
            --hidden-import "uvicorn.lifespan" \
            --hidden-import "uvicorn.lifespan.on" \
            --hidden-import "webview" \
            launcher.py

      - name: Package as zip
        run: |
          cd dist
          zip -r MusicDL-macOS-arm64.zip MusicDL/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicDL-macOS-arm64
          path: dist/MusicDL-macOS-arm64.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn requests rich websocket-client pyinstaller pywebview

      - name: Build with PyInstaller
        run: |
          pyinstaller --onedir --name "MusicDL" --add-data "static;static" --add-data "sources;sources" --add-data "server.py;." --add-data "server_models.py;." --add-data "server_state.py;." --add-data "server_routes_config.py;." --add-data "server_routes_search.py;." --add-data "server_routes_download.py;." --add-data "server_routes_auth.py;." --add-data "api.py;." --add-data "downloader.py;." --add-data "utils.py;." --add-data "models.py;." --add-data "cdp_cookies.py;." --add-data "logger.py;." --add-data "exporter.py;." --add-data "link_extractor.py;." --hidden-import "websocket" --hidden-import "uvicorn.logging" --hidden-import "uvicorn.loops" --hidden-import "uvicorn.loops.auto" --hidden-import "uvicorn.protocols" --hidden-import "uvicorn.protocols.http" --hidden-import "uvicorn.protocols.http.auto" --hidden-import "uvicorn.protocols.websockets" --hidden-import "uvicorn.protocols.websockets.auto" --hidden-import "uvicorn.lifespan" --hidden-import "uvicorn.lifespan.on" launcher.py

      - name: Package as zip
        run: |
          cd dist
          Compress-Archive -Path MusicDL -DestinationPath MusicDL-Windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicDL-Windows-x64
          path: dist/MusicDL-Windows-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Install Python dependencies
        run: |
          pip install fastapi uvicorn requests rich websocket-client pyinstaller pywebview

      - name: Build with PyInstaller
        run: |
          pyinstaller --onedir --name "MusicDL" \
            --add-data "static:static" \
            --add-data "sources:sources" \
            --add-data "server.py:." \
            --add-data "api.py:." \
            --add-data "downloader.py:." \
            --add-data "utils.py:." \
            --add-data "models.py:." \
            --add-data "cdp_cookies.py:." \
            --add-data "logger.py:." \
            --add-data "exporter.py:." \
            --add-data "link_extractor.py:." \
            --hidden-import "websocket" \
            --hidden-import "uvicorn.logging" \
            --hidden-import "uvicorn.loops" \
            --hidden-import "uvicorn.loops.auto" \
            --hidden-import "uvicorn.protocols" \
            --hidden-import "uvicorn.protocols.http" \
            --hidden-import "uvicorn.protocols.http.auto" \
            --hidden-import "uvicorn.protocols.websockets" \
            --hidden-import "uvicorn.protocols.websockets.auto" \
            --hidden-import "uvicorn.lifespan" \
            --hidden-import "uvicorn.lifespan.on" \
            launcher.py

      - name: Package as tar.gz
        run: |
          cd dist
          tar czf MusicDL-Linux-x64.tar.gz MusicDL/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicDL-Linux-x64
          path: dist/MusicDL-Linux-x64.tar.gz
